[project]
name = "astra"
version = "0.3.0"
description = "ASTRA - local-first quantitative research and AI/ML platform for US equities, Indian equities and crypto."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # numerics / storage
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scipy>=1.13",
    # stats / econometrics
    "statsmodels>=0.14",
    "arch>=7.0",
    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    # portfolio
    "cvxpy>=1.5",
    # data access (free sources only)
    "yfinance>=0.2.50",
    "requests>=2.32",
    "exchange-calendars>=4.5",
    # engineering
    "pydantic>=2.8",
    "structlog>=24.4",
    # microstructure live capture (was only present transitively via streamlit)
    "websockets>=13",
    "pyyaml>=6.0",
    "typer>=0.12",
    # dashboard
    "streamlit>=1.38",
    "plotly>=5.24",
]

[project.optional-dependencies]
# PyTorch is installed from the CUDA index via [tool.uv.sources]; CPU fallback works with the same code.
dl = ["torch>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
astra = "astra.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PD", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"src/astra/cli.py" = ["B008"]  # typer.Argument defaults are the documented typer idiom
"tests/test_dl_datasets.py" = ["E402"]  # imports follow pytest.importorskip("torch")

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
# pandas/numpy stubs return wide unions (Series | bool, Timestamp | NaTType, ndarray | Series) for
# operations whose runtime type is fixed. These rules are kept visible as warnings rather than
# errors; everything else (undefined names, unbound variables, imports, optional access) stays an error.
# See docs/KNOWN_ISSUES.md (KI-3).
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportGeneralTypeIssues = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportOperatorIssue = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test requires internet access to a free data provider",
    "slow: long-running test",
    "gpu: requires CUDA",
]
