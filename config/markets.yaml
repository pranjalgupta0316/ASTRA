# Market definitions. Costs are ASSUMPTIONS (per side, basis points) - see
# .claude/skills/backtesting-audit/references/cost_and_cv.md and docs/RESEARCH_METHODOLOGY.md.
markets:
  US:
    description: US equities and ETFs
    calendar: XNYS            # exchange_calendars code
    exchange_tz: America/New_York
    currency: USD
    periods_per_year: 252
    costs_bps: {commission: 0.0, half_spread: 1.0, slippage: 2.0, sell_tax: 0.3}
  IN:
    description: Indian equities (NSE symbols via Yahoo '.NS')
    calendar: XBOM            # BSE calendar used as NSE proxy (shared holiday list); see KNOWN_ISSUES
    exchange_tz: Asia/Kolkata
    currency: INR
    periods_per_year: 252
    # STT on delivery 0.1% per side dominates; exchange + stamp approximated in commission
    costs_bps: {commission: 1.5, half_spread: 2.0, slippage: 3.0, sell_tax: 10.0, buy_tax: 10.0}
  CRYPTO:
    description: Crypto spot (Binance)
    calendar: "24/7"
    exchange_tz: UTC
    currency: USDT
    periods_per_year: 365
    costs_bps: {commission: 10.0, half_spread: 1.0, slippage: 2.0}

instruments:
  - {symbol: AAPL, market: US, provider: yahoo, provider_symbol: AAPL, exchange: NASDAQ}
  - {symbol: RELIANCE, market: IN, provider: yahoo, provider_symbol: RELIANCE.NS, exchange: NSE}
  - {symbol: BTCUSDT, market: CRYPTO, provider: binance_vision, provider_symbol: BTCUSDT, exchange: BINANCE}
  # expansion universe (added after the vertical slice passed audit, 2026-11-24)
  - {symbol: MSFT, market: US, provider: yahoo, provider_symbol: MSFT, exchange: NASDAQ}
  - {symbol: NVDA, market: US, provider: yahoo, provider_symbol: NVDA, exchange: NASDAQ}
  - {symbol: SPY, market: US, provider: yahoo, provider_symbol: SPY, exchange: NYSEARCA}
  - {symbol: QQQ, market: US, provider: yahoo, provider_symbol: QQQ, exchange: NASDAQ}
  - {symbol: TCS, market: IN, provider: yahoo, provider_symbol: TCS.NS, exchange: NSE}
  - {symbol: INFY, market: IN, provider: yahoo, provider_symbol: INFY.NS, exchange: NSE}
  - {symbol: HDFCBANK, market: IN, provider: yahoo, provider_symbol: HDFCBANK.NS, exchange: NSE}
  - {symbol: NIFTY50, market: IN, provider: yahoo, provider_symbol: ^NSEI, exchange: NSE}
  - {symbol: ETHUSDT, market: CRYPTO, provider: binance_vision, provider_symbol: ETHUSDT, exchange: BINANCE}
  - {symbol: SOLUSDT, market: CRYPTO, provider: binance_vision, provider_symbol: SOLUSDT, exchange: BINANCE}

# Instruments never used to design a hypothesis - held out for confirmatory tests (e.g. H-XM-003)
holdout: [MSFT, NVDA, SPY, QQQ, TCS, INFY, HDFCBANK, NIFTY50, ETHUSDT, SOLUSDT]

defaults:
  start: "2018-01-01"
